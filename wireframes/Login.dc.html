<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Patrick Hand', 'Noto Sans Devanagari', cursive; color: #33402f; }
    a { color: #6b8a5a; } a:hover { color: #4f6a41; }
    .frame { width: 390px; height: 844px; background: #faf7f0; border: 2.5px solid #33402f; border-radius: 30px; box-sizing: border-box; overflow: hidden; position: relative; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .field { border: 2px solid #33402f; border-radius: 8px; padding: 12px 14px; font-size: 18px; font-family: inherit; color: #8a8578; background: #fff; }
    .btn { border: 2px solid #33402f; border-radius: 8px; padding: 14px; text-align: center; font-size: 20px; background: #6b8a5a; color: #faf7f0; }
    .link { text-align: center; font-size: 16px; color: #33402f; text-decoration: underline; }
    .langrow { display:flex; gap:8px; justify-content:center; }
    .langpill { border:2px solid #33402f; border-radius:999px; padding:6px 14px; font-size:15px; background:#fff; }
    .langpill-on { border:2px solid #33402f; border-radius:999px; padding:6px 14px; font-size:15px; background:#33402f; color:#faf7f0; }
  </style>
</helmet>
<div class="frame">
  <div class="screen" style="padding: 36px 28px; justify-content: center; gap: 22px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#33402f" stroke-width="1.6">
        <path d="M12 21c-4-3-7-6.5-7-10.5A7 7 0 0 1 12 3a7 7 0 0 1 7 7.5C19 14.5 16 18 12 21z"/>
        <path d="M12 21V10"/>
        <path d="M12 13c-2-1-3-3-3-5"/>
        <path d="M12 10c2-1 3-2.5 3-4"/>
      </svg>
      <div style="font-size: 32px;">AgriTrack</div>
      <div style="font-size: 16px; color:#8a8578;">{{tagline}}</div>
    </div>

    <div class="langrow">
      <div class="{{enClass}}" onClick="{{pickEn}}">English</div>
      <div class="{{hiClass}}" onClick="{{pickHi}}">हिंदी</div>
      <div class="{{mrClass}}" onClick="{{pickMr}}">मराठी</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="field">{{emailPlaceholder}}</div>
      <div class="field">{{passwordPlaceholder}}</div>
    </div>
    <div class="btn">{{loginBtn}}</div>
    <div class="link">{{signupLink}}</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"lang":{"editor":"enum","default":"mr","options":["en","hi","mr"],"section":"Language"}}'>
const STRINGS = {
  en: {
    tagline: 'grow smarter, spend wiser',
    emailPlaceholder: 'Email or phone',
    passwordPlaceholder: 'Password',
    loginBtn: 'Log In',
    signupLink: "New here? Create account"
  },
  hi: {
    tagline: 'समझदारी से उगाएं, बचत से खर्च करें',
    emailPlaceholder: 'ईमेल या फोन नंबर',
    passwordPlaceholder: 'पासवर्ड',
    loginBtn: 'लॉग इन करें',
    signupLink: 'नए हैं? खाता बनाएं'
  },
  mr: {
    tagline: 'हुशारीने पिकवा, शहाणपणाने खर्च करा',
    emailPlaceholder: 'ईमेल किंवा फोन नंबर',
    passwordPlaceholder: 'पासवर्ड',
    loginBtn: 'लॉग इन करा',
    signupLink: 'नवीन आहात? खाते तयार करा'
  }
};

class Component extends DCLogic {
  renderVals() {
    const current = this.state.lang || this.props.lang || 'mr';
    const t = STRINGS[current];
    const pillClass = (code) => code === current ? 'langpill-on' : 'langpill';
    return {
      ...t,
      enClass: pillClass('en'),
      hiClass: pillClass('hi'),
      mrClass: pillClass('mr'),
      pickEn: () => this.setState({ lang: 'en' }),
      pickHi: () => this.setState({ lang: 'hi' }),
      pickMr: () => this.setState({ lang: 'mr' })
    };
  }
}
</script>
</body>
</html>
