<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Patrick Hand', 'Noto Sans Devanagari', cursive; color: #33402f; }
    a { color: #6b8a5a; } a:hover { color: #4f6a41; }
    .frame { width: 390px; height: 844px; background: rgba(51,64,47,0.35); border: 2.5px solid #33402f; border-radius: 30px; box-sizing: border-box; overflow: hidden; position: relative; display:flex; align-items:flex-end; }
    .sheet { width:100%; background:#faf7f0; border-top: 2.5px solid #33402f; border-radius: 20px 20px 0 0; padding: 22px 22px 28px; box-sizing:border-box; }
    .option { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1.5px dashed #cfc9b8; font-size:16px; }
    .radio { width:18px; height:18px; border-radius:50%; border:2px solid #33402f; }
    .radio-on { width:18px; height:18px; border-radius:50%; border:2px solid #33402f; background:#6b8a5a; }
    .field { border: 2px solid #33402f; border-radius: 8px; padding: 10px 12px; font-size: 15px; background: #fff; color:#8a8578; }
    .btn { border: 2px solid #33402f; border-radius: 8px; padding: 12px; text-align: center; font-size: 18px; background: #6b8a5a; color: #faf7f0; margin-top:16px; }
  </style>
</helmet>
<div class="frame">
  <div class="sheet">
    <div style="font-size:21px; margin-bottom:8px;">{{title}}</div>
    <div>
      <div class="option"><div class="radio-on"></div>{{optWater}}</div>
      <div class="option"><div class="radio"></div>{{optPesticide}}</div>
      <div class="option"><div class="radio"></div>{{optFertilizer}}</div>
      <div class="option" style="border-bottom:none;"><div class="radio"></div>{{optOther}}</div>
    </div>
    <div style="display:flex; gap:12px; margin-top:14px;">
      <div style="flex:1;">
        <div style="font-size:13px; color:#8a8578; margin-bottom:4px;">{{dateLabel}}</div>
        <div class="field">{{dateValue}}</div>
      </div>
      <div style="flex:1;">
        <div style="font-size:13px; color:#8a8578; margin-bottom:4px;">{{costLabel}}</div>
        <div class="field">₹ ____</div>
      </div>
    </div>
    <div style="margin-top:12px;">
      <div style="font-size:13px; color:#8a8578; margin-bottom:4px;">{{notesLabel}}</div>
      <div class="field" style="height:40px;"></div>
    </div>
    <div class="btn">{{saveBtn}}</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"lang":{"editor":"enum","default":"mr","options":["en","hi","mr"],"section":"Language"}}'>
const STRINGS = {
  en: { title: 'Log Activity', optWater: 'Water', optPesticide: 'Pesticide', optFertilizer: 'Fertilizer', optOther: 'Weeding / Other',
    dateLabel: 'Date', dateValue: '07 Sep 2026', costLabel: 'Cost (optional)', notesLabel: 'Notes', saveBtn: 'Save' },
  hi: { title: 'गतिविधि दर्ज करें', optWater: 'पानी', optPesticide: 'कीटनाशक', optFertilizer: 'उर्वरक', optOther: 'निराई / अन्य',
    dateLabel: 'तारीख', dateValue: '07 सितंबर 2026', costLabel: 'लागत (वैकल्पिक)', notesLabel: 'टिप्पणी', saveBtn: 'सहेजें' },
  mr: { title: 'क्रियाकलाप नोंदवा', optWater: 'पाणी', optPesticide: 'कीटकनाशक', optFertilizer: 'खत', optOther: 'निंदणी / इतर',
    dateLabel: 'तारीख', dateValue: '07 सप्टेंबर 2026', costLabel: 'खर्च (ऐच्छिक)', notesLabel: 'टीप', saveBtn: 'जतन करा' }
};

class Component extends DCLogic {
  renderVals() {
    const current = this.props.lang || 'mr';
    return { ...STRINGS[current] };
  }
}
</script>
</body>
</html>
